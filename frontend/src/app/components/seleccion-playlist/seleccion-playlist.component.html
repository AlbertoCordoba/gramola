<div class="container-setup">
  <div class="content-wrapper">

    <div class="glass-card setup-card fade-in">
      
      <div class="header-setup">
        <div class="icon-static">📻</div>
        <h2>Música de Ambiente</h2>
      </div>

      <div *ngIf="statusMessage" class="status-alert"
           [style.color]="statusMessage.includes('❌') || statusMessage.includes('⚠️') ? '#ff4d4d' : '#1ed760'">
        {{ statusMessage }}
      </div>
      
      <div *ngIf="necesitaConexion" class="connect-section fade-in">
        <p class="description-text">
          Para activar la Gramola, vincula tu cuenta de Spotify Premium.
        </p>
        
        <div class="pulse-container">
          <button (click)="conectarSpotify()" class="btn-primary glow-effect">
            <img src="https://storage.googleapis.com/pr-newsroom-wp/1/2018/11/Spotify_Logo_CMYK_Black.png" class="spotify-logo-btn">
            Conectar con Spotify
          </button>
        </div>
      </div>

      <div *ngIf="!necesitaConexion" class="search-section fade-in">
        <p class="description-text">Elige la playlist base para tu bar.</p>

        <div class="search-box">
          <div class="mini-spinner" *ngIf="cargando"></div>
          <span class="search-icon" *ngIf="!cargando">🔍</span>

          <input type="text" 
                 [(ngModel)]="busqueda" 
                 (ngModelChange)="onTyping()" 
                 (keyup.enter)="forceSearch()" 
                 placeholder="Ej: Rock FM, Top 50 España...">
          
          <button (click)="forceSearch()" class="btn-search">Buscar</button>
        </div>

        <div class="results-list" *ngIf="resultados.length > 0">
          <div class="playlist-item" 
               *ngFor="let pl of resultados" 
               (click)="seleccionar(pl)"
               [class.active]="playlistSeleccionada?.id === pl.id">
            
            <div class="img-wrapper">
               <div class="img-skeleton" *ngIf="!pl.imgLoaded"></div>
               <img [src]="pl.images?.[0]?.url || 'assets/disc.png'" 
                    (load)="pl.imgLoaded = true"
                    [class.visible]="pl.imgLoaded"
                    class="pl-img" alt="Portada">
            </div>

            <div class="pl-info">
              <span class="pl-name">{{ pl.name }}</span>
              <span class="pl-tracks">{{ pl.tracks?.total || 0 }} canciones</span>
            </div>
            
            <button class="btn-select">
               {{ playlistSeleccionada?.id === pl.id ? '✅' : 'Elegir' }}
            </button>
          </div>
        </div>
        
        <p *ngIf="!cargando && resultados.length === 0 && busqueda.length > 2" class="no-results">
          No se encontraron playlists.
        </p>

        <div *ngIf="playlistSeleccionada" class="footer-actions fade-in">
          <button (click)="confirmar()" class="btn-primary">
            Confirmar y Entrar
          </button>
        </div>
      </div>

    </div>

  </div>
</div>
