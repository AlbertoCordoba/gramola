<div class="pasarela-container fade-in">
  <div class="header">
    <h2>Pasarela de Pago Segura</h2>
    <p class="text-muted">
      Estás pagando: <strong>{{ datosPago?.concepto || datosPago?.tipo }}</strong>
    </p>
  </div>
  
  <div *ngIf="errorGeneral" class="alert alert-danger">
    {{ errorGeneral }}
  </div>
  
  <div *ngIf="mensajeExito" class="alert alert-success">
    ✅ {{ mensajeExito }}
  </div>

  <div class="stripe-box" [hidden]="mensajeExito">
    <label class="label-tarjeta">Información de tarjeta</label>
    
    <div id="card-element" class="field"></div>
    
    <div id="card-errors" role="alert" class="text-danger mt-2 small"></div>
  </div>

  <div class="actions" *ngIf="!mensajeExito">
    <button (click)="cancelar()" class="btn-cancel" [disabled]="procesando">
      Cancelar
    </button>
    
    <button (click)="confirmarPago()" class="btn-pay" [disabled]="procesando || !stripeReady">
      <span *ngIf="procesando" class="spinner"></span>
      <span *ngIf="!procesando">Pagar {{ datosPago?.precio }}€</span>
    </button>
  </div>
</div>
